<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
    <linearGradient id="coinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
  </defs>
  
  <!-- Fond d'application -->
  <rect width="512" height="512" rx="112" fill="url(#bg)" />
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="#10b981" stroke-width="4" stroke-opacity="0.3" />

  <!-- Symbole Tirelire / Salaire -->
  <g transform="translate(64, 76)">
    <!-- Pièce d'or qui tombe dans la tirelire -->
    <circle cx="192" cy="40" r="44" fill="url(#coinGrad)" stroke="#d97706" stroke-width="6" />
    <text x="192" y="55" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="900" text-anchor="middle" fill="#78350f">€</text>

    <!-- Corps de la tirelire -->
    <path d="M 96,150 C 40,150 20,200 20,270 C 20,340 60,370 120,370 L 130,410 C 132,418 140,424 150,424 L 180,424 C 190,424 196,416 194,406 L 190,370 L 260,370 L 264,406 C 266,416 274,424 284,424 L 314,424 C 324,424 332,418 334,410 L 344,370 C 374,360 384,330 384,270 C 384,200 350,150 280,150 Z" fill="url(#brandGrad)" />
    
    <!-- Fente de la tirelire -->
    <rect x="156" y="146" width="72" height="12" rx="6" fill="#064e3b" />
    
    <!-- Museau -->
    <ellipse cx="40" cy="260" rx="28" ry="36" fill="#6ee7b7" />
    <circle cx="36" cy="252" r="6" fill="#047857" />
    <circle cx="36" cy="268" r="6" fill="#047857" />
    
    <!-- Œil -->
    <circle cx="96" cy="216" r="14" fill="#0f172a" />
    <circle cx="93" cy="213" r="5" fill="#ffffff" />
    
    <!-- Oreille -->
    <polygon points="120,150 140,100 165,150" fill="#34d399" />
  </g>
</svg>
