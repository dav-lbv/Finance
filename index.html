<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#050506" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <!-- Icônes : ?v=2 force les navigateurs à abandonner l'ancienne icône en cache -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png?v=2" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png?v=2" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg?v=2" />
    <link rel="shortcut icon" href="/favicon.ico?v=2" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=2" />
    <meta name="apple-mobile-web-app-title" content="Mon Kanda" />
    <title>Mon Kanda - Gestion financière, dépenses &amp; épargne</title>
    <meta name="description" content="Mon Kanda : Application moderne de gestion de salaire, suivi des dépenses du mois, récurrences, épargne et budget personnel." />
    <meta property="og:title" content="Mon Kanda - Gestion financière, dépenses &amp; épargne" />
    <meta property="og:description" content="Mon Kanda : Application moderne de gestion de salaire, suivi des dépenses du mois, récurrences, épargne et budget personnel." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      // Applique le thème avant le premier rendu (évite le flash)
      try {
        var m = localStorage.getItem('monsalaire_theme_mode') || 'dark';
        var dark = m === 'dark' || (m === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.classList.add(dark ? 'dark' : 'light');
      } catch (e) { document.documentElement.classList.add('dark'); }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
