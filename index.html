<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#050506" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="GesFin" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <title>GesFin - Gestion Financière, Dépenses &amp; Épargne</title>
    <meta name="description" content="GesFin : Application moderne de gestion de salaire, suivi des dépenses du mois, récurrences, épargne et budget personnel." />
    <meta property="og:title" content="GesFin - Gestion Financière, Dépenses &amp; Épargne" />
    <meta property="og:description" content="GesFin : Application moderne de gestion de salaire, suivi des dépenses du mois, récurrences, épargne et budget personnel." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      // Applique le thème avant le premier rendu (évite le flash)
      try {
        var m = localStorage.getItem('monsalaire_theme_mode') || 'dark';
        var dark = m === 'dark' || (m === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.classList.add(dark ? 'dark' : 'light');
      } catch (e) { document.documentElement.classList.add('dark'); }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
